<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Ceci n'est pas une page</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: radial-gradient(circle at 30% 20%, #fdf6e3 0%, #f3e3c3 55%, #e8cfa0 100%);
            color: #2b2118;
            font-family: Georgia, "Times New Roman", serif;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 48px;
            max-width: 980px;
            width: 100%;
        }

        .frame {
            flex: 0 1 340px;
            padding: 22px;
            background: linear-gradient(135deg, #b8862b, #7a5414 45%, #c99a3c 70%, #6b4710);
            border-radius: 6px;
            box-shadow: 0 24px 48px rgba(60, 35, 10, 0.35);
        }

        .canvas {
            background: #f6efe0;
            padding: 28px 24px 22px;
            box-shadow: inset 0 0 0 6px #e2d3b3, inset 0 0 30px rgba(120, 90, 40, 0.25);
            text-align: center;
        }

        .canvas svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .page-sheet {
            animation: float 5s ease-in-out infinite;
            transform-origin: center;
        }

        .caption {
            margin: 16px 0 0;
            font-size: 1.15rem;
            font-style: italic;
            letter-spacing: 0.02em;
        }

        .plaque {
            flex: 1 1 340px;
            max-width: 460px;
        }

        .code {
            margin: 0;
            font-size: clamp(4.5rem, 16vw, 8rem);
            line-height: 1;
            color: #a0451f;
            letter-spacing: 0.04em;
        }

        h1 {
            margin: 8px 0 16px;
            font-size: clamp(1.6rem, 4.5vw, 2.4rem);
            font-weight: normal;
        }

        p {
            margin: 0 0 28px;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #5a4633;
        }

        .home-button {
            display: inline-block;
            padding: 14px 30px;
            background: #2b2118;
            color: #fdf6e3;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-decoration: none;
            border-radius: 999px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .home-button:hover,
        .home-button:focus {
            background: #a0451f;
            transform: translateY(-2px);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        @media (max-width: 720px) {
            .gallery {
                gap: 32px;
                text-align: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .page-sheet {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main class="gallery">
        <figure class="frame">
            <div class="canvas">
                <svg viewBox="0 0 200 200" role="img" aria-label="A blank sheet of paper floating in a frame">
                    <ellipse cx="100" cy="182" rx="52" ry="7" fill="#d8c7a4"/>
                    <g class="page-sheet">
                        <path d="M58 28 H124 L146 50 V168 H58 Z" fill="#ffffff" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
                        <path d="M124 28 V50 H146" fill="#efe4cc" stroke="#2b2118" stroke-width="3" stroke-linejoin="round"/>
                        <line x1="72" y1="72" x2="132" y2="72" stroke="#e3d6bb" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8"/>
                        <line x1="72" y1="92" x2="124" y2="92" stroke="#e3d6bb" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8"/>
                        <line x1="72" y1="112" x2="132" y2="112" stroke="#e3d6bb" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8"/>
                        <text x="102" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#a0451f">?</text>
                    </g>
                </svg>
                <figcaption class="caption">Ceci n'est pas une page.</figcaption>
            </div>
        </figure>
        <section class="plaque">
            <p class="code">404</p>
            <h1>Ceci n'est pas une page</h1>
            <p>This looks like a page, but there is nothing here. The address you followed may be mistyped, or the page may have moved or no longer exists.</p>
            <a class="home-button" href="/">Back to the homepage</a>
        </section>
    </main>
</body>
</html>
